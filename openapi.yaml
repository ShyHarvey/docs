openapi: 3.1.0
info:
  title: Tiny Tasks API
  version: 1.0.0
  description: Небольшой REST API для управления задачами.
servers:
  - url: https://api.example.com/v1
    description: Production
security:
  - bearerAuth: []
tags:
  - name: Tasks
    description: Создание и просмотр задач
paths:
  /tasks:
    get:
      operationId: listTasks
      summary: Получить список задач
      tags: [Tasks]
      responses:
        "200":
          description: Список задач
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createTask
      summary: Создать задачу
      tags: [Tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTask"
            example:
              title: Попробовать Mintlify
      responses:
        "201":
          description: Задача создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Некорректное тело запроса
        "401":
          $ref: "#/components/responses/Unauthorized"
  /tasks/{taskId}:
    get:
      operationId: getTask
      summary: Получить задачу
      tags: [Tasks]
      parameters:
        - name: taskId
          in: path
          required: true
          description: Идентификатор задачи
          schema:
            type: string
          example: task_01J9ZP8W3K
      responses:
        "200":
          description: Найденная задача
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Задача не найдена
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
  schemas:
    CreateTask:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: Попробовать Mintlify
    Task:
      type: object
      required: [id, title, completed, createdAt]
      properties:
        id:
          type: string
          example: task_01J9ZP8W3K
        title:
          type: string
          example: Попробовать Mintlify
        completed:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time
          example: "2026-10-13T12:00:00Z"
  responses:
    Unauthorized:
      description: API-ключ отсутствует или недействителен
